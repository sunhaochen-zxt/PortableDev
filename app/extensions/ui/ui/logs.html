<!doctype html>
<html data-theme="light">
<head><meta charset="utf-8"><title>日志</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="wrap">
<header class="hero"><h1>日志</h1><div class="muted">最近 50 条（pd log --tail 50）</div></header>
<section class="card"><pre class="logs" id="out"><span class="loading">加载中…</span></pre></section>
</div>
<script src="common.js"></script>
<script>
(async () => {
  const out = document.getElementById("out");
  try {
    const timed = await pdTimed(["log", "--tail", "50"]);
    const result = timed.result;
    const lines = (result.events || []).filter((event) => event.type === "log")
      .map((event) => {
        const record = event.record || {};
        const time = String(record.ts || "").slice(11, 19);
        return ((time ? time + " " : "") + (record.level || "info") + "  " + (record.msg || "")).trim();
      });
    out.textContent = lines.join("\n") || "（没有日志）";
    out.scrollTop = out.scrollHeight;
    showTiming("页面" + navMs() + "ms · log命令" + timed.ms + "ms");
  } catch (error) {
    out.textContent = "";
    renderError(out, error);
  }
})();
</script>
</body></html>
