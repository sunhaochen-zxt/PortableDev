<!doctype html>
<html data-theme="light">
<head>
  <meta charset="utf-8">
  <title>设置 · PortableDev</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-left">
      <h1><span class="hero-icon" data-icon="sliders" data-size="18"></span>设置</h1>
      <div class="muted">UI 外观定制与 PortableDev 内核/系统参数分离管理</div>
    </div>
    <div class="hero-actions">
      <div class="tabs" role="tablist" aria-label="设置分类">
        <button type="button" class="tab-btn active" id="tab-ui" data-tab="ui">UI 设置</button>
        <button type="button" class="tab-btn" id="tab-system" data-tab="system">系统设置</button>
      </div>
      <button class="secondary sm" id="refresh" style="display:none;"><span data-icon="refresh" data-size="14"></span>刷新</button>
    </div>
  </header>

  <!-- Panel 1: UI 设置 (Theme, Visual Style, Custom Wallpaper, Monet Dynamic Color) -->
  <div id="pane-ui">
    <section class="card">
      <div class="card-head">
        <h2><span data-icon="moon" data-size="15"></span>明暗主题</h2>
        <span class="badge muted" id="active-theme-badge">—</span>
      </div>
      <div class="wallpaper-actions">
        <button type="button" class="secondary sm" id="theme-light-btn"><span data-icon="sun" data-size="14"></span>浅色模式</button>
        <button type="button" class="secondary sm" id="theme-dark-btn"><span data-icon="moon" data-size="14"></span>深色模式</button>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2><span data-icon="sliders" data-size="15"></span>界面视觉风格</h2>
        <span class="badge" id="active-style-badge">—</span>
      </div>
      <div class="style-grid" id="style-picker"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2><span data-icon="compass" data-size="15"></span>壁纸与 MD3 莫奈动态取色</h2>
        <div class="monet-swatch-row" id="settings-monet-swatches"></div>
      </div>
      <div class="wallpaper-actions">
        <label class="cropper-check"><input type="checkbox" id="wp-all-styles-chk" checked>启用背景壁纸（全部风格生效）</label>
        <button type="button" class="sm" id="wp-upload-btn">上传并裁剪壁纸</button>
        <button type="button" class="secondary sm" id="wp-extract-btn">从当前壁纸莫奈取色</button>
        <button type="button" class="ghost sm" id="wp-reset-btn">恢复默认壁纸与色盘</button>
      </div>
    </section>
  </div>

  <!-- Panel 2: 系统设置 (config/settings.json editor via pd config list / set / unset) -->
  <div id="pane-system" style="display:none;">
    <section class="card">
      <div class="toolbar">
        <div class="input-box">
          <span data-icon="search" data-size="15"></span>
          <input type="search" id="filter" placeholder="搜索系统配置键（例如 kernel.*、network.timeout、proc.*）…">
        </div>
        <span class="badge" id="count">—</span>
      </div>
    </section>

    <div id="groups"><section class="card empty">正在读取系统配置…</section></div>
  </div>
</div>

<script src="common.js"></script>
<script>
const GROUP_TITLES = {
  ui: "外观与界面",
  kernel: "内核与运行",
  root: "路径与便携盘",
  install: "包安装策略",
  network: "网络与代理",
  proc: "进程限额",
  log: "日志与审计",
  gc: "垃圾回收",
  recovery: "崩溃恢复",
  elevation: "提权策略",
};

let allSettings = [];
let systemLoaded = false;

function switchTab(tab) {
  const isUi = tab !== "system";
  document.getElementById("tab-ui").classList.toggle("active", isUi);
  document.getElementById("tab-system").classList.toggle("active", !isUi);
  document.getElementById("pane-ui").style.display = isUi ? "" : "none";
  document.getElementById("pane-system").style.display = isUi ? "none" : "";
  document.getElementById("refresh").style.display = isUi ? "none" : "";
  if (!isUi && !systemLoaded) {
    load();
  }
  if ((getUiStyle() === "glass" || getUiStyle() === "glass-chrome") && window.PDLiquidGlass) {
    setTimeout(() => window.PDLiquidGlass.mount(true), 30);
  }
}

document.getElementById("tab-ui").addEventListener("click", () => switchTab("ui"));
document.getElementById("tab-system").addEventListener("click", () => switchTab("system"));

function unquote(raw) {
  const text = String(raw ?? "");
  try {
    const parsed = JSON.parse(text);
    return parsed === null || parsed === undefined ? "" : String(parsed);
  } catch (e) {
    return text;
  }
}

function renderGroups() {
  const container = document.getElementById("groups");
  const q = document.getElementById("filter").value.trim().toLowerCase();
  container.textContent = "";

  const filtered = allSettings.filter((s) => !q || s.key.toLowerCase().includes(q) || s.value.toLowerCase().includes(q));
  document.getElementById("count").textContent = filtered.length + " 项设置";

  if (filtered.length === 0) {
    const empty = document.createElement("section");
    empty.className = "card empty";
    empty.textContent = "没有匹配的系统配置项";
    container.appendChild(empty);
    return;
  }

  const map = new Map();
  for (const item of filtered) {
    const prefix = item.key.includes(".") ? item.key.split(".")[0] : "other";
    if (!map.has(prefix)) map.set(prefix, []);
    map.get(prefix).push(item);
  }

  for (const [prefix, list] of map.entries()) {
    const card = document.createElement("section");
    card.className = "card";

    const head = document.createElement("div");
    head.className = "card-head";
    const h2 = document.createElement("h2");
    h2.textContent = (GROUP_TITLES[prefix] || "其他配置") + " (" + prefix + ")";
    const badge = document.createElement("span");
    badge.className = "badge muted";
    badge.textContent = list.length + " 项";
    head.appendChild(h2);
    head.appendChild(badge);
    card.appendChild(head);

    for (const item of list) {
      const row = document.createElement("div");
      row.className = "setting-row";

      const left = document.createElement("div");
      const keyEl = document.createElement("div");
      keyEl.className = "setting-key";
      keyEl.textContent = item.key;
      left.appendChild(keyEl);

      const input = document.createElement("input");
      input.type = "text";
      input.value = item.value;
      input.setAttribute("aria-label", item.key);
      if (item.key === "schema") input.disabled = true;

      const actions = document.createElement("div");
      actions.style.display = "flex";
      actions.style.gap = "6px";

      const saveBtn = document.createElement("button");
      saveBtn.className = "sm";
      saveBtn.textContent = "保存";
      saveBtn.disabled = item.key === "schema";
      saveBtn.addEventListener("click", async () => {
        saveBtn.disabled = true;
        try {
          const res = await window.pd.run(["config", "set", item.key, input.value]);
          const restart = res.done && res.done.metrics && res.done.metrics.restartRequired;
          if (item.key === "ui.theme") {
            const next = input.value.trim().toLowerCase() === "dark" ? "dark" : "light";
            syncHtmlThemeClasses(next);
            try { sessionStorage.setItem("pd-ui-theme", next); } catch (e) { /* ignore */ }
            syncThemeButtons();
            // Apply immediately in the shell chrome too (native palette + every page).
            if (window.pd && typeof window.pd.setTheme === "function") {
              try { await window.pd.setTheme(next); } catch (e) { /* optional */ }
            }
          }
          showToast(item.key + " 已保存" + (restart ? "（重启内核后生效）" : ""), "ok");
          load();
        } catch (err) {
          showToast((err && err.message) || String(err), "error");
          saveBtn.disabled = false;
        }
      });

      const resetBtn = document.createElement("button");
      resetBtn.className = "secondary sm";
      resetBtn.textContent = "默认";
      resetBtn.disabled = item.key === "schema";
      resetBtn.addEventListener("click", async () => {
        resetBtn.disabled = true;
        try {
          await window.pd.run(["config", "unset", item.key]);
          if (item.key === "ui.theme" && window.pd && typeof window.pd.setTheme === "function") {
            try { await window.pd.setTheme("light"); } catch (e) { /* optional */ }
          }
          showToast(item.key + " 已恢复默认", "ok");
          load();
        } catch (err) {
          showToast((err && err.message) || String(err), "error");
          resetBtn.disabled = false;
        }
      });

      actions.appendChild(saveBtn);
      actions.appendChild(resetBtn);
      row.appendChild(left);
      row.appendChild(input);
      row.appendChild(actions);
      card.appendChild(row);
    }

    container.appendChild(card);
  }
}

async function load() {
  const btn = document.getElementById("refresh");
  btn.disabled = true;
  try {
    const timed = await pdTimed(["config", "list"]);
    const tbl = extractTable(timed.result);
    allSettings = tbl.rows.map((r) => ({ key: String(r[0] ?? ""), value: unquote(r[1]) }));
    systemLoaded = true;
    renderGroups();
    showTiming("config list " + timed.ms + "ms");
  } catch (error) {
    const container = document.getElementById("groups");
    container.textContent = "";
    const card = document.createElement("section");
    card.className = "card";
    renderError(card, error);
    container.appendChild(card);
  } finally {
    btn.disabled = false;
  }
}

function syncThemeButtons() {
  const dark = document.documentElement.dataset.theme === "dark";
  document.getElementById("active-theme-badge").textContent = dark ? "深色" : "浅色";
  document.getElementById("theme-light-btn").className = dark ? "secondary sm" : "sm";
  document.getElementById("theme-dark-btn").className = dark ? "sm" : "secondary sm";
}

// The shell broadcasts theme changes (settings save/reset, config set) as "pd-theme".
window.pdThemeChanged = function () {
  syncThemeButtons();
  if (typeof refreshMonetSwatches === "function") refreshMonetSwatches();
  if (typeof refreshWallpaperPreview === "function") refreshWallpaperPreview();
};

function applyExplicitTheme(target) {
  const cur = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
  if (cur !== target) {
    toggleTheme(true);
  }
  syncThemeButtons();
  refreshMonetSwatches();
}

function renderStylePicker() {
  const picker = document.getElementById("style-picker");
  const badge = document.getElementById("active-style-badge");
  const current = getUiStyle();
  badge.textContent = getUiStyleName(current);
  picker.textContent = "";
  for (const st of PD_STYLES) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "style-option" + (st.id === current ? " active" : "");

    const prev = document.createElement("div");
    prev.className = "style-preview " + st.id;
    const c1 = document.createElement("div");
    c1.className = "style-preview-chip";
    const c2 = document.createElement("div");
    c2.className = "style-preview-chip";
    prev.appendChild(c1);
    prev.appendChild(c2);

    const name = document.createElement("div");
    name.className = "style-name";
    name.textContent = st.name;

    const desc = document.createElement("div");
    desc.className = "style-desc";
    desc.textContent = st.desc;

    btn.appendChild(prev);
    btn.appendChild(name);
    btn.appendChild(desc);
    btn.addEventListener("click", () => {
      setUiStyle(st.id);
      renderStylePicker();
    });
    picker.appendChild(btn);
  }
}

function refreshMonetSwatches() {
  const row = document.getElementById("settings-monet-swatches");
  if (!row || !window.PDWallpaper) return;
  const seed = window.PDWallpaper.getMd3Seed();
  const tok = window.PDWallpaper.buildMonetTokens(seed, document.documentElement.dataset.theme === "dark");
  row.textContent = "";
  const lbl = document.createElement("span");
  lbl.className = "muted";
  lbl.textContent = "莫奈色盘 " + seed;
  row.appendChild(lbl);
  for (const col of tok.swatches) {
    const dot = document.createElement("span");
    dot.className = "monet-dot";
    dot.style.background = col;
    dot.title = col;
    row.appendChild(dot);
  }
}

const wpAllChk = document.getElementById("wp-all-styles-chk");
wpAllChk.addEventListener("change", () => {
  loadVendorScript("vendor/monet-wallpaper.js").then(() => window.PDWallpaper.setWallpaperOnAllStyles(wpAllChk.checked));
});
function syncWpControls() {
  refreshMonetSwatches();
  if (window.PDWallpaper) wpAllChk.checked = window.PDWallpaper.isWallpaperOnAllStyles();
}

document.getElementById("theme-light-btn").addEventListener("click", () => applyExplicitTheme("light"));
document.getElementById("theme-dark-btn").addEventListener("click", () => applyExplicitTheme("dark"));
document.getElementById("wp-upload-btn").addEventListener("click", () => {
  loadVendorScript("vendor/monet-wallpaper.js").then(() => window.PDWallpaper.openCropper());
});
document.getElementById("wp-extract-btn").addEventListener("click", () => {
  loadVendorScript("vendor/monet-wallpaper.js").then(() => window.PDWallpaper.extractFromCurrentWallpaper(false));
});
document.getElementById("wp-reset-btn").addEventListener("click", () => {
  loadVendorScript("vendor/monet-wallpaper.js").then(() => window.PDWallpaper.resetWallpaper());
});
window.addEventListener("pd-wallpaper-change", syncWpControls);
document.getElementById("filter").addEventListener("input", renderGroups);
document.getElementById("refresh").addEventListener("click", load);

syncThemeButtons();
renderStylePicker();
loadVendorScript("vendor/monet-wallpaper.js").then(syncWpControls).catch(() => {});
</script>
</body>
</html>
