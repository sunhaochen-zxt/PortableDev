<!doctype html>
<html data-theme="light">
<head><meta charset="utf-8"><title>软件包</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="wrap">
<header class="hero"><h1>软件包</h1><div class="muted">已安装的包（调用 pd list）</div></header>
<section class="card toolbar"><button id="refresh">刷新</button><span class="badge" id="count">—</span></section>
<section class="card"><table id="table"><thead></thead><tbody><tr><td><span class="loading">加载中…</span></td></tr></tbody></table></section>
</div>
<script src="common.js"></script>
<script>
async function load() {
  const button = document.getElementById("refresh");
  const table = document.getElementById("table");
  const head = table.querySelector("thead");
  const body = table.querySelector("tbody");
  const count = document.getElementById("count");
  button.disabled = true;
  try {
    const timed = await pdTimed(["list"]);
    const result = timed.result;
    head.innerHTML = "";
    body.innerHTML = "";
    const tableEvent = (result.events || []).filter((event) => event.type === "table").pop();
    const rows = (tableEvent && tableEvent.rows) || [];
    if (tableEvent) {
      const tr = document.createElement("tr");
      for (const column of tableEvent.columns || []) {
        const th = document.createElement("th");
        th.textContent = column.title || column.key;
        tr.appendChild(th);
      }
      head.appendChild(tr);
      for (const row of rows) {
        const tr2 = document.createElement("tr");
        for (let index = 0; index < row.length; index++) tr2.appendChild(cell(row, index));
        body.appendChild(tr2);
      }
    } else {
      body.innerHTML = "<tr><td>没有数据</td></tr>";
    }
    count.textContent = rows.length + " 个包";
    showTiming("页面" + navMs() + "ms · list命令" + timed.ms + "ms");
  } catch (error) {
    body.innerHTML = "";
    renderError(body, error);
  } finally {
    button.disabled = false;
  }
}
document.getElementById("refresh").addEventListener("click", load);
load();
</script>
</body></html>
