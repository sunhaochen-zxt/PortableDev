schema = 1

[tool]
id      = 'python'
version = "3.13.18"
title   = 'CPython (python-build-standalone)'
kind    = 'tar.gz'
archive = "downloads/python/3.13.18/cpython-3.13.18+20261026-x86_64-pc-windows-msvc-install_only.tar.gz"
sha256  = "ebe90cc1dce2dd2d7afa1f0aa9b6c269c7c0174aeabdc6a801381602b7283424"
strip   = 1

[[path]]
dir = '.'

[[path]]
dir = 'Scripts'

[[verify]]
run    = 'python --version'
expect = 'Python 3.13.18'

[[verify]]
run    = 'python -c "import ssl,sqlite3,ctypes,zlib,lzma;print(1)"'
expect = '1'

# ---- 更新源 ----
# GitHub 只用来查版本；真正的下载走 npmmirror（快得多）。
# {build} 来自下面正则的命名捕获组，{ver} 是 python 版本。
[update]
kind    = 'github'
repo    = 'astral-sh/python-build-standalone'
pattern = 'cpython-(?<ver>3\.13\.\d+)\+(?<build>\d+)-x86_64-pc-windows-msvc-install_only\.tar\.gz'
url     = 'https://registry.npmmirror.com/-/binary/python-build-standalone/{build}/cpython-{ver}+{build}-x86_64-pc-windows-msvc-install_only.tar.gz'