schema = 1

[tool]
id      = '7zip'
version = "26.05"
title   = '7-Zip (standalone 7zr)'
kind    = 'raw'
archive = "downloads/7zip/26.05/7zr.exe"
sha256  = "9bf582b894dfa665f852d7e9112b02290a1c303c2d95a21fcdc41ffcb03143b7"
rename  = '7zr.exe'

# The NSIS installer (7z2501-x64.exe) is kept in downloads for reference but is
# not used: 7zr is the standalone extractor and needs no registry integration.
[[path]]
dir = '.'

[[verify]]
run    = '7zr i'
expect = '7-Zip'

[update]
kind    = 'sevenzip'
index   = 'https://www.7-zip.org/download.html'
pattern = '7-Zip\s+(?<ver>\d+\.\d+)'
# 这个工具就是独立的 7zr，GitHub release 直接提供裸 exe。
# （www.7-zip.org/a/ 下没有 extra 包，安装器解出来也没有 7zr.exe。）
url     = 'https://github.com/ip7z/7zip/releases/download/{version}/7zr.exe'