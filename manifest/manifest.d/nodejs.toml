schema = 1

[tool]
id      = 'nodejs'
version = "26.13.0"
title   = 'Node.js'
kind    = 'zip'
archive = "downloads/nodejs/26.13.0/node-v26.13.0-win-x64.zip"
sha256  = "dcc60d59a0746999f99064a01c020445d54d84228c691cdbf25b49ac3b59150a"
strip   = 1

[[path]]
dir = '.'

# The npm global prefix is redirected onto the stick by NPM_CONFIG_PREFIX
# ({{ROOT}}\home\npm-global), so `npm i -g` writes its shims there instead of
# %APPDATA%\npm. Without this entry those shims exist but are unreachable: PATH
# only carried the node directory itself.
[[path]]
dir = '{{ROOT}}\home\npm-global'

[[verify]]
run    = 'node --version'
expect = 'v26.13.0'

[[verify]]
run    = 'npm --version'
expect = '11.'

[update]
kind    = 'node'
index   = 'https://npmmirror.com/mirrors/node/index.json'
pattern = '^\d+\.\d+\.\d+$'
url     = 'https://npmmirror.com/mirrors/node/v{version}/node-v{version}-win-x64.zip'