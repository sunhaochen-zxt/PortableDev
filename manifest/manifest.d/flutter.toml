schema = 1

[tool]
id       = 'flutter'
version  = '3.47.9'
title    = 'Flutter SDK (Web target)'
kind     = 'prebuilt'
dir      = 'tools/flutter/3.47.9'
provides = ['flutter', 'dart']
# Official stable release zip, unpacked by hand into this directory:
#   https://storage.flutter-io.cn/flutter_infra_release/releases/stable/windows/flutter_windows_3.47.9-stable.zip
#   sha256 d8e2b5977e09082c6440f89dc1aa887b94c8fbcc3b39222797046295a3f68a9e
#
# Only the WEB target is set up by this directory alone. `flutter build windows` works
# too, but it needs the portable MSVC toolset (tools\msvc) and the Visual Studio shape
# that goes with it - run `call scripts\msvc-activate.cmd` first. See msvc.toml and the
# "Building Windows desktop apps" section of the README.
#
# bin\cache\ carries the Dart SDK, the engine artifacts and the prebuilt
# flutter_tools.snapshot, so it travels with this directory and a new machine does not
# have to rebuild the tool (which needs the network).
notes    = 'Web by default; Windows desktop builds after scripts\msvc-activate.cmd; upgrade = replace this version directory'

[[path]]
dir = 'bin'

# pub packages must not land in %LOCALAPPDATA%\Pub\Cache, or a restored machine has to
# re-download every dependency. This is the same cache `dart pub get` uses.
[[env]]
name  = 'PUB_CACHE'
value = '{{ROOT}}\cache\pub'

# Flutter and Dart otherwise write an analytics/telemetry config into the user profile
# (~/.dart-tool). Nothing here is worth carrying between machines.
[[env]]
name  = 'FLUTTER_SUPPRESS_ANALYTICS'
value = 'true'

# Git refuses to touch a repository whose owner is another account ("dubious ownership",
# git >= 2.35). This checkout was prepared on a different machine, so on a new machine
# every flutter command died at "Error: Unable to determine engine version..." before it
# did anything: bin\internal\update_engine_version.ps1 asks git for the engine version and
# an unreadable repository yields nothing.
#
# These three variables add exactly one safe.directory entry - this tool's directory - to
# every git invocation on the machine. They live in the manifest instead of a per-machine
# git config on purpose: apply rewrites them every time, so a drive-letter change or a
# restored machine does not bring the error back, and nothing has to be edited by hand on
# each new machine.
#
# Note: GIT_CONFIG_COUNT is machine-wide, so a second env-based git setting would have to
# extend this block (COUNT=2, KEY_1, VALUE_1) rather than appear somewhere else.
[[env]]
name  = 'GIT_CONFIG_COUNT'
value = '1'

[[env]]
name  = 'GIT_CONFIG_KEY_0'
value = 'safe.directory'

[[env]]
name  = 'GIT_CONFIG_VALUE_0'
value = '{{TOOL}}'

# These two checks deliberately avoid the `flutter` / `dart` batch wrappers. Both take
# Flutter's startup lock: shared.bat opens bin\cache\flutter.bat.lock through handle 9 and
# retries forever when that fails. A child process of an executable sitting directly under
# the stick root is denied write access on this machine, so the lock is never taken, no
# output appears, and the check waits for the 60 s timeout - while `flutter --version` in a
# normal shell answers in two seconds.
#
# So start the Dart VM directly, and check that the flutter tool snapshot is in place.
# `flutter --version` by hand is still the way to confirm the SDK itself.
[[verify]]
run    = 'bin\cache\dart-sdk\bin\dart.exe --version'
expect = 'Dart SDK version: 3.13.7'

[[verify]]
run    = 'cmd.exe /c dir /b bin\cache\flutter_tools.snapshot'
expect = 'flutter_tools.snapshot'
