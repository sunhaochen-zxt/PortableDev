schema = 1

[tool]
id       = 'msvc'
version  = '14.44.35207'
title    = 'MSVC toolset + Windows SDK (portable)'
kind     = 'prebuilt'
dir      = 'tools/msvc'
provides = ['cl', 'link', 'msvc']
# Fetched with msvc-kit 0.2.23 (https://github.com/loonghao/msvc-kit, MIT):
#
#   msvc-kit download --vs-channel 2022 --msvc-version 14.44 \
#       --sdk-version 10.0.22621.0 --arch x64 --target <stick>\tools\msvc
#
# msvc-kit pulls Microsoft's own payloads and unpacks them itself, so there is no
# Visual Studio installer, no admin rights and no registry writes. `tools\msvc\setup.cmd`
# is generated by `msvc-kit setup --script --shell cmd --portable-root %~dp0` and uses
# %~dp0 throughout, so it survives a drive-letter change.
#
# On top of that stock layout this directory carries a Visual Studio *shape*, because
# Flutter's Windows build is hard coded to one (see
# tools\flutter\<ver>\packages\flutter_tools\lib\src\windows\visual_studio.dart):
#
#   Common7\IDE\CommonExtensions\Microsoft\CMake\CMake   junction -> tools\cmake\<ver>
#   MSBuild\                                             MSBuild 17.3 + VC v170 targets
#   VC\Auxiliary\Build\vcvars64.bat, vcvarsall.bat       wrappers around setup.cmd
#   VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt   read by CMake to find the toolset
#   pf86\Microsoft Visual Studio\Installer\vswhere.exe   shim that reports this instance
#
# `flutter build windows` additionally needs scripts\msvc-activate.cmd in the calling
# shell: it exports EnterpriseWDK/DisableRegistryUse/VSINSTALLDIR/VisualStudioVersion,
# which is the documented escape hatch CMake uses to accept an instance that the Visual
# Studio Installer has never heard of, plus UseEnv=true so the C++ MSBuild targets trust
# INCLUDE/LIB from the environment instead of the registry.
#
# MSBuild is 17.3 while the toolset is 14.44, so Microsoft.CppBuild.targets would reject
# the pair (MSB8052); activate disables that single consistency check. The binaries are
# compatible (both are v143 ABI) and the result is proven by a real
# `flutter build windows --release` run.
notes    = 'Portable cl.exe + Windows SDK 10.0.22621.0; for Flutter Windows call scripts\msvc-activate.cmd first'

[[path]]
dir = 'VC\Tools\MSVC\14.44.35207\bin\Hostx64\x64'

[[path]]
dir = 'Windows Kits\10\bin\10.0.22621.0\x64'

# cl.exe finds its headers only through INCLUDE and its import libraries only through
# LIB, so these three are part of the toolchain, not optional decoration.
[[env]]
name  = 'INCLUDE'
value = '{{TOOL}}\VC\Tools\MSVC\14.44.35207\include;{{TOOL}}\Windows Kits\10\Include\10.0.22621.0\ucrt;{{TOOL}}\Windows Kits\10\Include\10.0.22621.0\shared;{{TOOL}}\Windows Kits\10\Include\10.0.22621.0\um;{{TOOL}}\Windows Kits\10\Include\10.0.22621.0\winrt;{{TOOL}}\Windows Kits\10\Include\10.0.22621.0\cppwinrt'

[[env]]
name  = 'LIB'
value = '{{TOOL}}\VC\Tools\MSVC\14.44.35207\lib\x64;{{TOOL}}\Windows Kits\10\Lib\10.0.22621.0\ucrt\x64;{{TOOL}}\Windows Kits\10\Lib\10.0.22621.0\um\x64'

[[env]]
name  = 'WindowsSdkDir'
value = '{{TOOL}}\Windows Kits\10'

[[env]]
name  = 'WindowsSDKVersion'
value = '10.0.22621.0\'

[[env]]
name  = 'VCToolsInstallDir'
value = '{{TOOL}}\VC\Tools\MSVC\14.44.35207'

[[env]]
name  = 'VCToolsVersion'
value = '14.44.35207'

[[verify]]
run    = 'cmd.exe /c dir /b "VC\Tools\MSVC\14.44.35207\bin\Hostx64\x64\cl.exe"'
expect = 'cl.exe'

[[verify]]
run    = 'cmd.exe /c dir /b "Windows Kits\10\Include\10.0.22621.0\ucrt\stdio.h"'
expect = 'stdio.h'

[[verify]]
run    = 'cmd.exe /c dir /b "Windows Kits\10\Lib\10.0.22621.0\um\x64\kernel32.lib"'
expect = 'kernel32.lib'

[[verify]]
run    = 'cmd.exe /c dir /b "MSBuild\Current\Bin\MSBuild.exe"'
expect = 'MSBuild.exe'

[[verify]]
run    = 'cmd.exe /c dir /b "pf86\Microsoft Visual Studio\Installer\vswhere.exe"'
expect = 'vswhere.exe'
