schema = 1

[tool]
id      = 'git'
version = "2.56.0.4"
title   = 'Git for Windows (PortableGit)'
kind    = '7z-sfx'
archive = "downloads/git/2.56.0.4/PortableGit-2.56.0.4-64-bit.7z.exe"
sha256  = "b1f3e52216e2ed6882d1bebfd4d3fdf319bec40d2edbbf9fd26ec4fd3fce7ed1"
strip   = 0

# Only cmd\ is exposed. usr\bin is deliberately NOT on PATH: it would shadow
# Windows built-ins (find.exe, sort.exe, ...) and break unrelated scripts.
[[path]]
dir = 'cmd'

[[verify]]
run    = 'git --version'
# Git for Windows spells its build as 2.56.0.windows.4 while the tool version is
# 2.56.0.4; a version-token rewrite during an upgrade cannot match the "windows"
# form, so this string has to be corrected by hand after such an upgrade.
expect = 'git version 2.56.0.windows.4'

[update]
kind    = 'github'
repo    = 'git-for-windows/git'
pattern = 'PortableGit-(?<ver>\d+\.\d+\.\d+\.\d+)-64-bit\.7z\.exe'