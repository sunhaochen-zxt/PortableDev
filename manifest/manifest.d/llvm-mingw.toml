schema = 1

[tool]
id      = 'llvm-mingw'
version = '20261020'
title   = 'LLVM/Clang + MinGW-w64 (llvm-mingw, UCRT)'
kind    = 'prebuilt'
# Supplied out-of-band (not fetched by the downloader). The tree is the
# extracted llvm-mingw-20261020-ucrt-x86_64.zip, LLVM 23.1.3.
dir     = 'tools/llvm-mingw/20261020'
bundle  = ['clang 23.1.3', 'lld 23.1.3', 'mingw-w64 UCRT']

[[path]]
dir = 'bin'

[[env]]
name = 'CC'
value = '{{TOOL}}\bin\clang.exe'

[[env]]
name = 'CXX'
value = '{{TOOL}}\bin\clang++.exe'

[[verify]]
run    = 'clang --version'
expect = 'clang version 23.1.3'

[[verify]]
run    = 'ld.lld --version'
expect = 'LLD 23.1.3'

# Cross-targets shipped in the same tree:
#   x86_64-w64-mingw32 / i686-w64-mingw32 / aarch64-w64-mingw32 / armv7-w64-mingw32
# Default target is x86_64-w64-windows-gnu.
#
# IMPORTANT: without -static, clang++ output links against libc++.dll and
# libunwind.dll from <tool>\bin. Those resolve only while bin\ is on PATH.
# Use -static (or ship those two DLLs next to the exe) for standalone binaries.
notes = 'default C++ output needs libc++.dll + libunwind.dll; add -static for standalone exe'

[update]
kind    = 'github'
repo    = 'mstorsjo/llvm-mingw'
pattern = 'llvm-mingw-(?<ver>\d+)-ucrt-x86_64\.zip'