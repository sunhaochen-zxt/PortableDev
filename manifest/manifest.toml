schema = 1

# Portable dev root manifest.
# Placeholders resolved at apply time:
#   {{ROOT}}   -> stable junction path (default C:\Dev)
#   {{TOOL}}   -> {{ROOT}}\tools\<id>\<version>

# NOTE: path_order is a bare key, so it must come BEFORE the first [table] header,
# otherwise TOML folds it into the preceding table (a real bug this caught).
# Every [[array-of-tables]] section must likewise stay INSIDE its parent table:
# a [[home_dir]] written under [[env]] silently becomes env.home_dir and is lost.

# Order in which tool path entries are prepended to PATH.
# Tools not listed here still apply, appended in id order.
path_order = [
    'python',
    'nodejs',
    'git',
    'cmake',
    'ninja',
    'ripgrep',
    'jq',
    '7zip',
    'llvm-mingw',
    'vscode',
    'sublime-text',
    'powershell',
    'fastfetch',
    'flutter',
]

[root]
stable = 'C:\Dev'
marker = '.portabledev-root'

# Directories that must live on the stick, so they are not lost when the machine
# is restored. Each one becomes a junction on the system drive pointing into
# {{ROOT}}\home.
#
# The user profile folder itself is NOT redirected: NTFS cannot host a junction
# over it, and the browser and installer profiles must not move.
#
# Deliberately not listed:
#   .nuget   - hundreds of MB of package cache; losing it only costs a re-download
#   AppData\Local\Temp - multi-GB; wiping it on every boot is a feature, not a loss
[[home_dir]]
for  = 'VSCode windows and settings'
root = 'APPDATA'
path = 'Code'

[[home_dir]]
for  = 'VSCode Insiders windows and settings'
root = 'APPDATA'
path = 'Code - Insiders'

[[home_dir]]
for  = 'Sublime Text settings'
root = 'APPDATA'
path = 'Sublime Text'

[[home_dir]]
for  = 'pwsh profile and history'
root = 'APPDATA'
path = 'PowerShell'

[[home_dir]]
for  = 'clangd index and misc tool config'
root = 'USERPROFILE'
path = '.config'

[[home_dir]]
for  = 'hex editors and other portable tools'
root = 'USERPROFILE'
path = '.portable'

# FlClash 0.9.2 has no portable mode of its own: profiles, subscriptions and settings
# always go to %APPDATA%\FlClash, through the Win32 known-folder API, so HOME cannot
# reach it. The junction is the only thing that carries them on the stick.
[[home_dir]]
for  = 'FlClash proxy profiles and settings'
root = 'APPDATA'
path = 'FlClash'

# DSH NEXT is deliberately NOT declared here. Its main process validates the data
# directory with lstat and refuses any reparse point ("Expected a real directory:
# C:\Users\<user>\.dsh"), so a junction at ~\.dsh makes the app die at startup before
# it even opens a window. It is redirected by DSH.cmd instead, which sets
# DSH_DESKTOP_NEXT_HOME to the stick's real path for that one process.

[apply]
# Move an existing real directory onto the stick instead of skipping it.
# Off by default: an upgrade should not silently relocate somebody's data.
# Turn it on when you want this machine's existing settings carried over.
home_adopt = false

# Machine-independent environment. Everything that would normally leak into
# %APPDATA% / %LOCALAPPDATA% is redirected onto the stick here.
[[env]]
name = 'HOME'
value = '{{ROOT}}\home'

[[env]]
name = 'NPM_CONFIG_PREFIX'
value = '{{ROOT}}\home\npm-global'

[[env]]
name = 'NPM_CONFIG_CACHE'
value = '{{ROOT}}\cache\npm'

[[env]]
name = 'PIP_CACHE_DIR'
value = '{{ROOT}}\cache\pip'

[[env]]
name = 'PIP_DISABLE_PIP_VERSION_CHECK'
value = '1'

[[env]]
name = 'PYTHONNOUSERSITE'
value = '1'

[[env]]
name = 'PYTHONUTF8'
value = '1'
